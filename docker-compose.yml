services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitledger
      POSTGRES_PASSWORD: splitledger
      POSTGRES_DB: splitledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPLITLEDGER_ENVIRONMENT: development
      SPLITLEDGER_DATABASE_URL: postgresql+asyncpg://splitledger:splitledger@db:5432/splitledger
      SPLITLEDGER_JWT_SECRET: local-compose-secret-not-for-production
      SPLITLEDGER_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    # Migrations run before the server so a fresh volume comes up ready.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn splitledger.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
